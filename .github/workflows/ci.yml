name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Unit tests
        run: zig build test --summary all
      - name: Build user space (riscv64)
        run: zig build
      - name: Build disk image
        run: zig build image -Ddisk-size=512
      - name: Render desktop previews
        run: zig build previews
      - name: Build hosted Zen
        run: zig build hosted
      - name: Hosted smoke test (log in through VNC)
        run: |
          sudo zig-out/hosted/zen-hosted > hosted.log 2>&1 &
          python3 hosted/smoke_test.py --timeout 60
      - name: Hosted log
        if: always()
        run: cat hosted.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: zen-previews
          path: zig-out/previews/
